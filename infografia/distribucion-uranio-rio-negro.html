<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribución de los principales proyectos de uranio en Río Negro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700;800&display=swap');

  .rn-uranio *{ box-sizing:border-box; }
  .rn-uranio{
    --bg:#f4f2ec;
    --panel:#ffffff;
    --border:#dedad0;
    --text:#2b2a25;
    --muted:#7a7669;
    --map-fill:#cfe8c6;
    --map-stroke:#8fb886;
    --black:#141414;
    --gray-hover:#3f3e3a;
    --gray-hover-bg:#eeeeec;
    --gray-selected-bg:#e3e3e0;
    --gray-focus:#8f8c82;
    --uv:#a4d99b;
    --u:#2f6b3a;
    font-family:'Chivo', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .rn-uranio{ padding:20px 14px 26px; }
  .rn-card{
    max-width:532px; margin:0 auto;
    background:var(--panel);
    overflow:hidden;
  }
  .rn-head{
    padding:8px 0px 0px;
    border-top:3px solid var(--black);
  }
  .rn-head h1{
    margin:0;
    font-size:22px; line-height:1.22; font-weight:800;
    letter-spacing:-0.005em;
    text-wrap:balance;
  }

  /* ---------- mapa ---------- */
  .rn-map-wrap{ position:relative; }
  .rn-map-clip{ overflow:hidden; padding-bottom:10px; }
  .rn-map-wrap svg{ display:block; width:100%; height:auto; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }

  .rn-minimap{
    position:absolute; top:8px; z-index:5; width:100px;
    border-radius:5px;
    padding:4px;
    opacity:0; transform:translateY(-3px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .rn-minimap.is-visible{ opacity:1; transform:translateY(0); }
  .rn-minimap svg{ display:block; width:100%; height:auto; }
  .rn-minimap-province{ fill:#d3d3d3; stroke:#5b5b5b; stroke-width:6px; }
  .rn-minimap-view{ fill:#ffffff; fill-opacity:0; stroke:var(--black); stroke-width:30px; }
  .rn-province{ fill:#edead7; stroke:#d1cdb3; stroke-width:4px; stroke-linejoin:round; }
  .rn-areas{ pointer-events:none; }
  .rn-mineral-shape{ stroke:none; }

  /* ---------- indicador de interactividad (se borra solo o al interactuar con el gráfico) ---------- */
  .rn-hint{
    position:absolute; top:22%; right:14%; z-index:6;
    width:52px; height:52px; pointer-events:none;
    opacity:1; transition:opacity .35s ease;
  }
  .rn-hint.is-leaving{ opacity:0; }
  .rn-hint-ping{
    position:absolute; inset:0; border-radius:50%;
    background:rgba(90,90,90,.6);
    animation:rn-hint-pulse 1.6s ease-in-out infinite;
  }
  /* la mano se ubica para que la punta del dedo quede centrada sobre el círculo que pulsa */
  .rn-hint .rn-hint-icon{ position:absolute; left:17.53px; top:13.91px; width:45px; height:auto; z-index:1; }
  @keyframes rn-hint-pulse{
    0%, 100%{ transform:scale(.8); opacity:.55; }
    50%{ transform:scale(1.25); opacity:.85; }
  }
  @media (prefers-reduced-motion:reduce){
    .rn-hint-ping{ animation:none; }
  }

  .rn-pin{ cursor:pointer; }
  .rn-pin circle.rn-pin-halo{ fill:var(--gray-hover); opacity:0; transition:opacity .18s ease, r .18s ease; }
  .rn-pin-dot{ fill:var(--black); stroke:#fff; stroke-width:2.4; transition:transform .12s ease, fill .12s ease; transform-box:fill-box; transform-origin:center; }
  .rn-pin-dot[data-diamond]{ transform:rotate(45deg); }
  .rn-pin text{ fill:#fff; font-family:'Chivo',sans-serif; font-weight:700; font-size:17px; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .rn-pin:hover .rn-pin-dot, .rn-pin.is-active .rn-pin-dot{ transform:scale(1.14); fill:var(--gray-hover); }
  .rn-pin:hover .rn-pin-dot[data-diamond], .rn-pin.is-active .rn-pin-dot[data-diamond]{ transform:rotate(45deg) scale(1.14); }
  .rn-pin.is-active circle.rn-pin-halo{ opacity:.20; r:26; }
  .rn-pin:focus-visible .rn-pin-dot{ outline:none; }
  .rn-pin:focus-visible circle.rn-pin-halo{ opacity:.28; r:24; }

  /* ---------- ciudades de referencia ---------- */
  .rn-city-dot{ fill:#fff; stroke:var(--black); stroke-width:3.5; }
  .rn-city-label{ fill:var(--text); font-family:'Chivo',sans-serif; font-weight:600; font-size:22px; letter-spacing:.01em; pointer-events:none; }

  /* ---------- pie ---------- */
  .rn-foot{
    display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; justify-content:space-between;
    padding:10px 0 0 0; border-top:2px solid var(--black);
    flex-direction:row-reverse;
  }
  .rn-foot .firma{ display:inline-flex; align-items:center; flex:none; }
  .rn-foot .firma svg{ height:15px; width:auto; display:block; }
  .rn-foot .fuente{ font-size:12px; color:var(--text); }

  /* ---------- cartelito / tooltip ---------- */
  .rn-tooltip{
    position:absolute; z-index:6; width:244px;
    background:var(--panel); color:var(--text);
    border:1px solid var(--border);
    border-radius:8px; padding:12px 14px 13px;
    box-shadow:0 10px 26px rgba(20,20,20,0.18);
    opacity:0; transform:translate(-50%, calc(-100% - 8px)) scale(.97);
    pointer-events:none; transition:opacity .13s ease, transform .13s ease;
  }
  .rn-tooltip.is-open{ opacity:1; transform:translate(-50%, calc(-100% - 14px)) scale(1); pointer-events:auto; }
  .rn-tooltip::after{
    content:''; position:absolute; left:50%; top:100%; width:12px; height:12px;
    background:var(--panel); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    transform:translate(-50%,-6px) rotate(45deg); border-radius:2px;
  }
  /* variante: el pin está cerca del borde superior del mapa, el cartel se abre hacia abajo */
  .rn-tooltip.below{ transform:translate(-50%,8px) scale(.97); }
  .rn-tooltip.below.is-open{ transform:translate(-50%,14px) scale(1); }
  .rn-tooltip.below::after{
    top:auto; bottom:100%; border-right:none; border-bottom:none;
    border-left:1px solid var(--border); border-top:1px solid var(--border);
    transform:translate(-50%,6px) rotate(45deg);
  }
  .rn-tooltip .tt-ref{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%; background:var(--black); color:#fff;
    font-size:11px; font-weight:700; margin-right:6px; flex:none;
  }
  .rn-tooltip .tt-title{ display:flex; align-items:center; font-size:13.5px; font-weight:700; margin-bottom:8px; padding-right:20px; }
  .rn-tooltip .tt-row{ display:flex; justify-content:space-between; gap:10px; font-size:11.5px; padding:3px 0; border-top:1px solid var(--border); }
  .rn-tooltip .tt-row:first-of-type{ border-top:none; }
  .rn-tooltip .tt-k{ color:var(--muted); }
  .rn-tooltip .tt-v{ font-weight:600; text-align:right; }
  .rn-tooltip .tt-close{
    position:absolute; top:2px; right:2px; width:26px; height:26px; border:none; background:none;
    color:var(--muted); font-size:22px; line-height:1; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .rn-tooltip .tt-close:hover{ color:var(--text); }

  /* ---------- tabla ---------- */
  .rn-table-scroll{ overflow-x:auto; }
  table.rn-table{ width:100%; border-collapse:collapse; table-layout:fixed; font-variant-numeric:tabular-nums; }
  table.rn-table thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.045em;
    color:var(--muted); font-weight:700; padding:0 6px 8px; border-bottom:2px solid var(--black);
  }
  table.rn-table thead th:first-child{ padding-left:2px; }
  .rn-th-btn{
    display:inline-flex; align-items:center; gap:4px; font:inherit; text-transform:inherit; letter-spacing:inherit;
    background:none; border:none; color:inherit; cursor:pointer; padding:4px 0;
  }
  .rn-th-btn:hover{ color:var(--text); }
  .rn-th-btn:focus-visible{ outline:2px solid var(--gray-focus); outline-offset:2px; border-radius:3px; }
  .rn-th-btn .arrow{ font-size:9px; opacity:.25; transition:opacity .12s ease, transform .12s ease; }
  th.is-sorted .rn-th-btn{ color:var(--text); }
  th.is-sorted .rn-th-btn .arrow{ opacity:1; color:var(--gray-hover); }
  th.is-sorted.dir-desc .rn-th-btn .arrow{ transform:rotate(180deg); }

  table.rn-table tbody td{ padding:6px 6px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
  table.rn-table tbody td:first-child{ padding-left:2px; }
  table.rn-table tbody tr{ cursor:pointer; transition:background .1s ease; }
  table.rn-table tbody tr:hover{ background:var(--gray-hover-bg); }
  table.rn-table tbody tr.is-selected{ background:var(--gray-selected-bg); }
  table.rn-table tbody tr:focus-visible{ outline:2px solid var(--gray-focus); outline-offset:-2px; }
  td.num{ text-align:left; font-weight:600; }
  td.proyecto{ font-weight:600; }

  .rn-ref-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background:var(--black); color:#fff;
    font-size:10.5px; font-weight:700; flex:none; transition:background .1s ease;
  }
  tr:hover .rn-ref-badge, tr.is-selected .rn-ref-badge{ background:var(--gray-hover); }

  .rn-badge-mineral{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; }
  .rn-badge-mineral .sw{ width:8px; height:8px; border-radius:2px; flex:none; }

  .rn-etapa{ color:var(--text); }

  /* ---------- leyenda de formas ---------- */
  .rn-legend{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
    padding:8px 0 10px 0; font-size:11.5px;
  }
  .rn-legend .lg-title{ font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#000000; }
  .rn-legend .lg-div{ width:1px; height:30px; background:#000000; }
  .rn-legend .lg-item{ display:flex; align-items:center; gap:6px; font-weight:500; color:var(--text); }
  .rn-legend .lg-shape{ flex:none; width:11px; height:11px; background:var(--black); }
  .rn-legend .lg-circle{ border-radius:50%; }
  .rn-legend .lg-square{ border-radius:2px; }
  .rn-legend .lg-diamond{ width:9px; height:9px; border-radius:1px; transform:rotate(45deg); }

  /* ---------- orden en mobile (reemplaza los headers clickeables) ---------- */
  .rn-sort-mobile{ display:none; margin-bottom:12px; }
  .rn-sort-mobile label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.045em; color:var(--muted); font-weight:700; display:block; margin-bottom:5px; }
  .rn-sort-mobile select{
    width:100%; font-family:inherit; font-size:13px; color:var(--text);
    border:1px solid var(--border); border-radius:6px; background:var(--bg);
    padding:8px 10px; height:38px;
  }
  .rn-sort-mobile select:focus{ outline:2px solid var(--gray-focus); outline-offset:1px; border-color:var(--gray-hover); }

  @media (max-width:640px){
    .rn-head h1{ font-size:18px; }
    .rn-map-wrap{ padding:6px 8px 2px; }
    .rn-table-scroll{ padding:0 0px 5px; overflow-x:visible; }
    .rn-legend .lg-div{ width:100%; height:1px; background:#000000; }
    .rn-legend{
      display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px 14px;
      padding:8px 0px 10px 3px; font-size:11.5px; flex-direction:column;
    }

    .rn-sort-mobile{ display:block; }

    /* la tabla pasa a filas compactas de 2 líneas (no una tarjeta larga por dato) */
    table.rn-table{ min-width:0; }
    table.rn-table thead{
      position:absolute; width:1px; height:1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; margin:-1px;
    }
    table.rn-table, table.rn-table tbody{ display:block; width:100%; }
    table.rn-table tbody tr{
      display:grid; width:100%;
      grid-template-columns:auto 1fr auto; grid-template-areas:"ref name name" "mineral etapa ha";
      column-gap:9px; row-gap:3px; align-items:center;
      border-top:1px solid var(--border);
      padding:8px 10px;
    }
    table.rn-table tbody td{ padding:0; border-bottom:none; }
    table.rn-table tbody td:nth-child(1){ grid-area:ref; }
    table.rn-table tbody td:nth-child(2){ grid-area:name; font-size:13.5px; }
    table.rn-table tbody td:nth-child(3){ grid-area:mineral; font-size:11px; }
    table.rn-table tbody td:nth-child(4){ grid-area:etapa; font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    table.rn-table tbody td:nth-child(5){ grid-area:ha; font-size:11px; text-align:right; }
    td.num::after{ content:' ha'; font-weight:400; color:var(--muted); }
  }
  @media (prefers-reduced-motion:reduce){
    .rn-uranio *{ transition:none !important; }
  }
</style>
</head>

    </div>

  </div>
</div>

<script>
(function(){
  var DATA = [
    {ref:1, nombre:'Ivana',          mineral:'U-V', etapa:'Evaluación económica preliminar', ha:6777,  titular:'Ivana Minerales SA',   x:628.2, y:409.9},
    {ref:2, nombre:'Anit',           mineral:'U-V', etapa:'Exploración inicial',              ha:13499, titular:'Minera Cielo Azul',     x:521.2, y:283.4},
    {ref:3, nombre:'Santa Bárbara',  mineral:'U-V', etapa:'Exploración inicial',              ha:4701,  titular:'Minera Cielo Azul',     x:501.9, y:250.6},
    {ref:4, nombre:'Anit Sur',       mineral:'U-V', etapa:'Prospección',                       ha:38937, titular:'Minera Cielo Azul',     x:566.5, y:336.2},
    {ref:5, nombre:'Ivana Central',  mineral:'U-V', etapa:'Exploración inicial',              ha:10468, titular:'Ivana Minerales SA',    x:611.3, y:383.6},
    {ref:6, nombre:'Ivana Norte',    mineral:'U-V', etapa:'Exploración inicial',              ha:3800,  titular:'Ivana Minerales SA',    x:593.8, y:359.3},
    {ref:7, nombre:'Catriel',        mineral:'U',   etapa:'Exploración inicial',              ha:12771, titular:'Comisión Nacional de Energía Atómica', x:431.8, y:30.4},
    {ref:8, nombre:'Barda Colorada', mineral:'U-V', etapa:'Prospección',                       ha:49958, titular:'Piche Resources SA',    x:422.8, y:50.7},
    {ref:9, nombre:'Lucho U',        mineral:'U',   etapa:'Prospección',                       ha:5930,  titular:'Claudio Guillermo Lucero', x:618.1, y:421.1}
  ];

  var CITIES = [
    {id:1, nombre:'Viedma',                  capital:true,  x:980.4,  y:464.4,  labelDx:-39.3, labelDy:35.5},
    {id:2, nombre:'San Carlos de Bariloche', capital:false, x:63.5,   y:507.6,  labelDx:-57.1, labelDy:39.5},
    {id:3, nombre:'General Roca',            capital:false, x:469.3,  y:200.9,  labelDx:16,    labelDy:2},
    {id:4, nombre:'Cipolletti',              capital:false, x:430.7,  y:192.2,  labelDx:-45.2, labelDy:-23.7},
    {id:5, nombre:'Valcheta',                capital:false, x:622.65, y:451.91, labelDx:-47.3, labelDy:29.6},
    {id:6, nombre:'San Antonio Oeste',       capital:false, x:762.3,  y:451.3,  labelDx:-11.7, labelDy:35.5},
    {id:7, nombre:'Catriel',                 capital:false, x:453.57, y:50.61,  labelDx:14,    labelDy:2},
    {id:8, nombre:'Choele Choel',            capital:false, x:692.5,  y:253,    labelDx:14,    labelDy:3.9},
    {id:9, nombre:'Los Menucos',             capital:false, x:376.3,  y:408.8,  labelDx:-62.9, labelDy:29.6}
  ];
  var CITY_SIZE = 8;
  var CITY_FONT_SIZE = 16;

  var root = document.getElementById('rnUranio');
  var pinsG = document.getElementById('rnPins');
  var cityPinsG = document.getElementById('rnCityPins');
  var svg = document.getElementById('rnSvg');
  var mapWrap = document.getElementById('rnMapWrap');
  var minimap = document.getElementById('rnMinimap');
  var hint = document.getElementById('rnHint');
  function dismissHint(){
    if(!hint) return;
    var el = hint;
    hint = null;
    el.classList.add('is-leaving');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 350);
  }
  var minimapRect = document.getElementById('rnMinimapRect');
  var tooltip = document.getElementById('rnTooltip');
  var ttBody = document.getElementById('rnTtBody');
  var tbody = document.getElementById('rnTbody');
  var thead = document.getElementById('rnThead');
  var sortSelect = document.getElementById('rnSortSelect');

  var state = { sortKey:'ref', sortDir:'asc', selected:null };

  function fmtHa(n){ return n.toLocaleString('es-AR'); }
  function mineralColor(m){ return m==='U' ? 'var(--u)' : 'var(--uv)'; }
  function mineralLabel(m){ return m==='U' ? 'Uranio' : 'Uranio - Vanadio'; }
  function byRef(ref){ return DATA.filter(function(x){ return x.ref===ref; })[0]; }

  var svgPt = svg.createSVGPoint();
  function clientToSvg(clientX, clientY){
    svgPt.x = clientX; svgPt.y = clientY;
    var ctm = svg.getScreenCTM();
    if(!ctm) return {x:0,y:0};
    var p = svgPt.matrixTransform(ctm.inverse());
    return {x:p.x, y:p.y};
  }

  // contrarresta el zoom del mapa para que los pines/ciudades no cambien de tamaño en pantalla
  var zoomInvScale = 1;
  // en mobile los pines/etiquetas se agrandan un poco extra para que se lean bien
  var mobileMQ = window.matchMedia('(max-width:640px)');
  var mobileBoost = mobileMQ.matches ? 1.18 : 1;
  function applyPinTransform(g, x, y){
    var s = zoomInvScale * mobileBoost;
    g.setAttribute('transform', 'translate('+x+','+y+') scale('+s+') translate('+(-x)+','+(-y)+')');
  }

  // ---------- pines de proyectos ----------
  // la forma encierra la etapa (como en el mapa minero de origen):
  // cuadrado = Prospección, círculo = Exploración, rombo = Evaluación económica preliminar (PEA)
  function shapeForEtapa(etapa){
    if(etapa === 'Prospección') return 'square';
    if(etapa === 'Evaluación económica preliminar') return 'diamond';
    return 'circle';
  }

  function positionDot(dot, cx, cy){
    if(dot.tagName === 'circle'){
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
    } else {
      var half = Number(dot.getAttribute('data-half'));
      dot.setAttribute('x', cx - half); dot.setAttribute('y', cy - half);
    }
  }

  function movePin(d){
    var g = pinEls[d.ref];
    var halo = g.querySelector('.rn-pin-halo');
    var dot = g.querySelector('.rn-pin-dot');
    var txt = g.querySelector('text');
    halo.setAttribute('cx', d.x); halo.setAttribute('cy', d.y);
    positionDot(dot, d.x, d.y);
    txt.setAttribute('x', d.x); txt.setAttribute('y', d.y+1);
    applyPinTransform(g, d.x, d.y);
  }

  var pinEls = {};
  DATA.forEach(function(d){
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','rn-pin');
    g.setAttribute('tabindex','0');
    g.setAttribute('role','button');
    g.setAttribute('aria-label', 'Proyecto ' + d.ref + ': ' + d.nombre + ' (' + d.etapa + ')');
    g.setAttribute('data-ref', d.ref);

    var halo = document.createElementNS('http://www.w3.org/2000/svg','circle');
    halo.setAttribute('class','rn-pin-halo');
    halo.setAttribute('r', 21);

    var shape = shapeForEtapa(d.etapa);
    var dot;
    if(shape === 'circle'){
      dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('r', 15.5);
    } else {
      dot = document.createElementNS('http://www.w3.org/2000/svg','rect');
      var half = shape === 'diamond' ? 15 : 13;
      dot.setAttribute('width', half*2); dot.setAttribute('height', half*2);
      dot.setAttribute('rx', shape === 'diamond' ? 2 : 3);
      dot.setAttribute('data-half', half);
      if(shape === 'diamond') dot.setAttribute('data-diamond', '1');
    }
    dot.setAttribute('class','rn-pin-dot');

    var txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.textContent = d.ref;

    g.appendChild(halo); g.appendChild(dot); g.appendChild(txt);
    pinsG.appendChild(g);
    pinEls[d.ref] = g;
    movePin(d);

    g.addEventListener('click', function(){ dismissHint(); selectRef(d.ref, g); });
    g.addEventListener('keydown', function(ev){
      if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); selectRef(d.ref, g); }
    });
  });
  // Ivana (ref 1) es el proyecto más importante: lo traemos al frente para que no quede tapado
  pinsG.appendChild(pinEls[1]);

  // ---------- ciudades de referencia (blancas, filete negro, solo texto) ----------
  function setCityLabel(label, x, y, name, fontSize, bold){
    while(label.firstChild) label.removeChild(label.firstChild);
    label.setAttribute('font-size', fontSize);
    label.style.fontWeight = bold ? 800 : 600;
    var words = name.split(' ');
    if(name.length <= 13 || words.length < 2){
      label.setAttribute('x', x); label.setAttribute('y', y + 5);
      label.textContent = name;
      return;
    }
    var best = 1, bestDiff = Infinity, acc = 0;
    for(var i=0; i<words.length-1; i++){
      acc += words[i].length + 1;
      var diff = Math.abs(acc - name.length/2);
      if(diff < bestDiff){ bestDiff = diff; best = i+1; }
    }
    var line1 = words.slice(0,best).join(' ');
    var line2 = words.slice(best).join(' ');
    var lh = fontSize * 1.15;
    var y1 = y - lh/2 + 5;
    var t1 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
    t1.setAttribute('x', x); t1.setAttribute('y', y1); t1.textContent = line1;
    var t2 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
    t2.setAttribute('x', x); t2.setAttribute('y', y1 + lh); t2.textContent = line2;
    label.appendChild(t1); label.appendChild(t2);
  }
  function moveCity(c){
    var el = cityEls[c.id];
    var dot = el.querySelector('.rn-city-dot');
    var label = el.querySelector('.rn-city-label');
    if(c.capital){
      dot.setAttribute('x', c.x - CITY_SIZE); dot.setAttribute('y', c.y - CITY_SIZE);
      dot.setAttribute('width', CITY_SIZE*2); dot.setAttribute('height', CITY_SIZE*2);
    } else {
      dot.setAttribute('cx', c.x); dot.setAttribute('cy', c.y); dot.setAttribute('r', CITY_SIZE);
    }
    var lx = c.x + (c.labelDx != null ? c.labelDx : CITY_SIZE + 6);
    var ly = c.y + (c.labelDy != null ? c.labelDy : 0);
    setCityLabel(label, lx, ly, c.nombre, CITY_FONT_SIZE, c.capital);
    applyPinTransform(el, c.x, c.y);
  }

  var cityEls = {};
  CITIES.forEach(function(c){
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','rn-city');

    var dot = c.capital
      ? document.createElementNS('http://www.w3.org/2000/svg','rect')
      : document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('class','rn-city-dot');
    if(c.capital) dot.setAttribute('rx', 1.5);

    var label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('class','rn-city-label');

    g.appendChild(dot); g.appendChild(label);
    cityPinsG.appendChild(g);
    cityEls[c.id] = g;
    moveCity(c);
  });

  // ---------- zoom / paneo del mapa (rueda, pellizco táctil, botones) ----------
  var BASE_VB = { x:-15, y:-15, w:1050, h:668 };
  var view = { x:BASE_VB.x, y:BASE_VB.y, w:BASE_VB.w, h:BASE_VB.h };
  var MIN_W = BASE_VB.w / 4.5;
  var suppressNextBgClick = false;

  function applyViewBox(){
    svg.setAttribute('viewBox', view.x+' '+view.y+' '+view.w+' '+view.h);
    zoomInvScale = view.w / BASE_VB.w;
    DATA.forEach(movePin);
    CITIES.forEach(moveCity);
    if(state.selected !== null && pinEls[state.selected]) positionTooltip(byRef(state.selected), pinEls[state.selected]);
    updateMinimap();
  }
  function updateMinimap(){
    minimapRect.setAttribute('x', view.x);
    minimapRect.setAttribute('y', view.y);
    minimapRect.setAttribute('width', view.w);
    minimapRect.setAttribute('height', view.h);
    minimap.classList.toggle('is-visible', view.w < BASE_VB.w - 1);
  }
  function clampView(){
    view.w = Math.max(MIN_W, Math.min(BASE_VB.w, view.w));
    view.h = view.w * (BASE_VB.h / BASE_VB.w);
    var maxX = BASE_VB.x + BASE_VB.w - view.w;
    var maxY = BASE_VB.y + BASE_VB.h - view.h;
    view.x = Math.max(BASE_VB.x, Math.min(maxX, view.x));
    view.y = Math.max(BASE_VB.y, Math.min(maxY, view.y));
  }
  function zoomAt(fx, fy, factor){
    var newW = Math.max(MIN_W, Math.min(BASE_VB.w, view.w / factor));
    var newH = newW * (BASE_VB.h / BASE_VB.w);
    var t = (fx - view.x) / view.w, u = (fy - view.y) / view.h;
    view.x = fx - t*newW; view.y = fy - u*newH;
    view.w = newW; view.h = newH;
    clampView();
    applyViewBox();
  }
  function panBy(dx, dy){
    view.x -= dx; view.y -= dy;
    clampView();
    applyViewBox();
  }

  svg.addEventListener('wheel', function(ev){
    ev.preventDefault();
    dismissHint();
    var p = clientToSvg(ev.clientX, ev.clientY);
    zoomAt(p.x, p.y, Math.pow(1.0018, -ev.deltaY));
  }, { passive:false });

  var activePointers = {};
  var pinchStartDist = 0, pinchStartView = null, pinchStartMid = null;
  var panPointerId = null, panLast = null, panMoved = false;

  svg.addEventListener('pointerdown', function(ev){
    dismissHint();
    var t = ev.target;
    if(t.closest && t.closest('.rn-pin')) return;
    activePointers[ev.pointerId] = {x:ev.clientX, y:ev.clientY};
    var ids = Object.keys(activePointers);
    if(ids.length === 2){
      panPointerId = null;
      var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
      pinchStartDist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
      pinchStartMid = clientToSvg((p1.x+p2.x)/2, (p1.y+p2.y)/2);
      pinchStartView = {x:view.x, y:view.y, w:view.w, h:view.h};
    } else if(ids.length === 1){
      panPointerId = ev.pointerId;
      panLast = {x:ev.clientX, y:ev.clientY};
      panMoved = false;
      try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    }
  });
  svg.addEventListener('pointermove', function(ev){
    if(!activePointers[ev.pointerId]) return;
    activePointers[ev.pointerId] = {x:ev.clientX, y:ev.clientY};
    var ids = Object.keys(activePointers);
    if(ids.length === 2 && pinchStartView && pinchStartDist > 0){
      var p1 = activePointers[ids[0]], p2 = activePointers[ids[1]];
      var dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
      var factor = dist / pinchStartDist;
      var newW = Math.max(MIN_W, Math.min(BASE_VB.w, pinchStartView.w / factor));
      var newH = newW * (BASE_VB.h / BASE_VB.w);
      var t = (pinchStartMid.x - pinchStartView.x) / pinchStartView.w;
      var u = (pinchStartMid.y - pinchStartView.y) / pinchStartView.h;
      view.x = pinchStartMid.x - t*newW; view.y = pinchStartMid.y - u*newH;
      view.w = newW; view.h = newH;
      clampView();
      applyViewBox();
    } else if(ev.pointerId === panPointerId && panLast){
      var dxPx = ev.clientX - panLast.x, dyPx = ev.clientY - panLast.y;
      if(Math.abs(dxPx) > 2 || Math.abs(dyPx) > 2) panMoved = true;
      var wrapBox = mapWrap.getBoundingClientRect();
      var unitsPerPx = view.w / wrapBox.width;
      panBy(dxPx*unitsPerPx, dyPx*unitsPerPx);
      panLast = {x:ev.clientX, y:ev.clientY};
    }
  });
  function endMapPointer(ev){
    delete activePointers[ev.pointerId];
    if(Object.keys(activePointers).length < 2) pinchStartView = null;
    if(ev.pointerId === panPointerId){
      panPointerId = null;
      if(panMoved) suppressNextBgClick = true;
    }
  }
  svg.addEventListener('pointerup', endMapPointer);
  svg.addEventListener('pointercancel', endMapPointer);

  // ---------- cartelito ----------
  function selectRef(ref, anchorEl){
    if(state.selected === ref){ closeTooltip(); return; }
    state.selected = ref;
    refreshSelectionUI();
    openTooltip(ref, anchorEl);
  }

  function closeTooltip(){
    state.selected = null;
    tooltip.classList.remove('is-open');
    refreshSelectionUI();
  }

  document.getElementById('rnTtClose').addEventListener('click', closeTooltip);
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') closeTooltip(); });
  mapWrap.addEventListener('click', function(ev){
    if(suppressNextBgClick){ suppressNextBgClick = false; return; }
    if(ev.target === svg || ev.target.classList.contains('rn-province')) closeTooltip();
  });

  function openTooltip(ref, anchorEl){
    var d = byRef(ref);
    ttBody.innerHTML =
      '<div class="tt-title"><span class="tt-ref">'+d.ref+'</span>'+d.nombre+'</div>'+
      '<div class="tt-row"><span class="tt-k">Titular</span><span class="tt-v">'+d.titular+'</span></div>'+
      '<div class="tt-row"><span class="tt-k">Mineral</span><span class="tt-v">'+mineralLabel(d.mineral)+'</span></div>'+
      '<div class="tt-row"><span class="tt-k">Etapa</span><span class="tt-v">'+d.etapa+'</span></div>'+
      '<div class="tt-row"><span class="tt-k">Superficie</span><span class="tt-v">'+fmtHa(d.ha)+' ha</span></div>';
    positionTooltip(d, anchorEl);
    tooltip.classList.add('is-open');
  }

  function positionTooltip(d, anchorEl){
    var dotEl = anchorEl.querySelector('.rn-pin-dot');
    var dotBox = dotEl.getBoundingClientRect();
    var wrapBox = mapWrap.getBoundingClientRect();
    var x = dotBox.left + dotBox.width/2 - wrapBox.left;
    var dotTop = dotBox.top - wrapBox.top;
    var dotBottom = dotBox.bottom - wrapBox.top;
    var ttW = 244;
    var minX = ttW/2 + 6, maxX = wrapBox.width - ttW/2 - 6;
    var clampedX = Math.max(minX, Math.min(maxX, x));
    tooltip.style.left = clampedX + 'px';
    // si el pin está muy arriba, no entra un cartel por encima: lo mostramos hacia abajo
    if(dotTop < 90){
      tooltip.style.top = dotBottom + 'px';
      tooltip.classList.add('below');
    } else {
      tooltip.style.top = dotTop + 'px';
      tooltip.classList.remove('below');
    }
  }

  function refreshSelectionUI(){
    Object.keys(pinEls).forEach(function(ref){
      pinEls[ref].classList.toggle('is-active', String(state.selected) === ref);
    });
    Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
      tr.classList.toggle('is-selected', String(state.selected) === tr.getAttribute('data-ref'));
    });
  }

  // ---------- tabla: orden ----------
  function getSorted(){
    var key = state.sortKey, dir = state.sortDir;
    return DATA.slice().sort(function(a,b){
      var av=a[key], bv=b[key];
      if(typeof av==='string'){ av=av.toLowerCase(); bv=bv.toLowerCase(); }
      if(av<bv) return dir==='asc' ? -1 : 1;
      if(av>bv) return dir==='asc' ? 1 : -1;
      return a.ref-b.ref;
    });
  }

  function render(){
    var sorted = getSorted();

    tbody.innerHTML = '';
    sorted.forEach(function(d){
      var tr = document.createElement('tr');
      tr.setAttribute('data-ref', d.ref);
      tr.setAttribute('tabindex','0');
      tr.innerHTML =
        '<td data-label="Ref."><span class="rn-ref-badge">'+d.ref+'</span></td>'+
        '<td class="proyecto" data-label="Proyecto">'+d.nombre+'</td>'+
        '<td data-label="Mineral"><span class="rn-badge-mineral"><span class="sw" style="background:'+mineralColor(d.mineral)+'"></span>'+d.mineral+'</span></td>'+
        '<td class="rn-etapa" data-label="Etapa">'+d.etapa+'</td>'+
        '<td class="num" data-label="Superficie (ha)">'+fmtHa(d.ha)+'</td>';
      tr.addEventListener('click', function(){ selectRef(d.ref, pinEls[d.ref]); });
      tr.addEventListener('keydown', function(ev){
        if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); selectRef(d.ref, pinEls[d.ref]); }
      });
      tbody.appendChild(tr);
    });

    Array.prototype.forEach.call(thead.querySelectorAll('th'), function(th){
      var active = th.getAttribute('data-key')===state.sortKey;
      th.classList.toggle('is-sorted', active);
      th.classList.toggle('dir-desc', active && state.sortDir==='desc');
    });

    // select de orden (mobile) — lo sincronizamos con el estado actual
    var comboValue = state.sortKey + ':' + state.sortDir;
    if(sortSelect.value !== comboValue){
      var hasOption = Array.prototype.some.call(sortSelect.options, function(o){ return o.value===comboValue; });
      sortSelect.value = hasOption ? comboValue : '';
    }

    refreshSelectionUI();
  }

  function applySort(key, dir){
    state.sortKey = key;
    state.sortDir = dir;
    render();
  }

  thead.addEventListener('click', function(ev){
    var th = ev.target.closest('th[data-key]');
    if(!th) return;
    var key = th.getAttribute('data-key');
    var dir = (state.sortKey===key) ? (state.sortDir==='asc' ? 'desc' : 'asc') : (key==='ha' ? 'desc' : 'asc');
    applySort(key, dir);
  });

  sortSelect.addEventListener('change', function(){
    var parts = sortSelect.value.split(':');
    if(parts.length===2) applySort(parts[0], parts[1]);
  });

  window.addEventListener('resize', function(){
    if(state.selected!==null) positionTooltip(byRef(state.selected), pinEls[state.selected]);
  });

  function handleMobileMQ(ev){
    mobileBoost = ev.matches ? 1.18 : 1;
    applyViewBox();
  }
  if(mobileMQ.addEventListener) mobileMQ.addEventListener('change', handleMobileMQ);
  else if(mobileMQ.addListener) mobileMQ.addListener(handleMobileMQ);

  render();
  updateMinimap();

  // ---------- indicador de interactividad: se borra al interactuar con el gráfico o solo a los 20s ----------
  setTimeout(dismissHint, 20000);

  // ---------- alto automático si está incrustado en un iframe ----------
  function postHeight(){
    try{
      if(window.parent && window.parent!==window){
        var h = document.body.scrollHeight;
        window.parent.postMessage({ rnGraficoHeight: h }, '*');
      }
    }catch(e){}
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  if(window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
  else { setInterval(postHeight, 700); }
})();
</script>
