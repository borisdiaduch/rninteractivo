<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elecciones en Brasil 2026: banner de resultados</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700;800&family=Fira+Sans:wght@400;500;600;700;800;900&display=swap');
  html, body{ margin:0; background:#fff; }
  .rn-bn *{ box-sizing:border-box; }
  .rn-bn{
    --panel:#ffffff;
    --bg:#f4f2ec;
    --text:#2b2a25;
    --muted:#7a7669;
    --black:#141414;
    --num:'Fira Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    max-width:1260px; margin:0 auto;
    font-family:'Chivo', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color:var(--text); background:var(--panel);
    -webkit-font-smoothing:antialiased;
  }
  .rn-bn [hidden]{ display:none !important; }
  .rn-bn a{ color:inherit; text-decoration:none; }
  .rn-rule{ height:0; border:0; border-top:2px solid #eee; margin:0; }   /* mismas líneas que la home del diario */

  /* ---------- cabezal ---------- */
  .rn-bn-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 0; color:var(--black); font-size:13px; font-weight:400; line-height:1.2; text-transform:uppercase; }
  .rn-bn-bar .t{ display:inline-flex; align-items:center; gap:7px; }
  .rn-bn-bar b{ font-weight:800; }
  .rn-bn-flag{ flex:none; width:20px; height:14px; display:block; }

  /* ---------- candidatos + botón ---------- */
  .rn-bn-main{ display:flex; align-items:center; justify-content:center; gap:12px 32px; padding:14px 0 12px; }
  .rn-duel-wrap{ position:relative; flex:0 1 auto; min-width:0; }
  .rn-duel{ display:flex; gap:28px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .rn-duel::-webkit-scrollbar{ display:none; }
  .rn-duel > :first-child{ margin-left:auto; }   /* centrado si entra todo; desde el borde si hay que deslizar */
  .rn-duel > :last-child{ margin-right:auto; }
  .rn-duel-wrap::before, .rn-duel-wrap::after{ content:""; position:absolute; top:0; bottom:0; width:40px; z-index:1; pointer-events:none; opacity:0; transition:opacity .2s ease; }
  .rn-duel-wrap::before{ left:0; background:linear-gradient(to right, var(--panel), rgba(255,255,255,0)); }
  .rn-duel-wrap::after{ right:0; background:linear-gradient(to left, var(--panel), rgba(255,255,255,0)); }
  .rn-duel-wrap.can-left::before, .rn-duel-wrap.can-right::after{ opacity:1; }
  .rn-rival{ flex:none; display:flex; align-items:center; gap:12px; }
  .rn-photo{ flex:none; width:73px; height:73px; border-radius:50%; overflow:hidden; position:relative; }
  .rn-photo img{ position:absolute; left:50%; width:100%; height:auto; display:block; transform:translateX(-50%); }
  /* la foto tiene el alto del bloque de texto: 22 + 4 + 30 + 2 + 15 = 73px */
  .rn-rival-name{ margin:0; font-family:var(--num); font-size:18px; line-height:22px; font-weight:700; }
  .rn-rival-pct{ margin:4px 0 0; font-family:var(--num); font-size:30px; line-height:30px; font-weight:1000; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .rn-rival-votes{ margin:2px 0 0; font-size:12px; line-height:15px; color:var(--text); font-variant-numeric:tabular-nums; }

  /* votos en blanco y nulos (sólo desktop): columna con divisor a la izquierda */
  .rn-bn-blank{ display:flex; flex-direction:column; justify-content:center; gap:14px; align-self:stretch; flex:none; padding-left:36px; border-left:2px solid #eee; }
  .rn-bn-blank > div{ display:flex; align-items:center; gap:12px; }
  .rn-bn-blank img{ flex:none; width:52px; height:auto; display:block; }
  .rn-bn-blank p{ margin:0; font-family:var(--num); line-height:1.1; }
  .rn-bn-blank .n{ font-size:13px; font-weight:700; color:#000; }
  .rn-bn-blank .v{ font-size:17px; font-weight:800; color:#a1a1a1; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* botón al mapa completo */
  .rn-bn-cta{ display:inline-flex; align-items:center; gap:7px; flex:none; padding:8px 12px; border-radius:999px; background:var(--bg); color:var(--text) !important; font-size:13.5px; font-weight:700; white-space:nowrap; transition:background .15s ease; }
  .rn-bn-cta:hover{ background:#e9e7e0; }
  .rn-bn-cta:focus-visible{ outline:2px solid #8f8c82; outline-offset:2px; }
  .rn-bn-cta svg{ flex:none; width:12px; height:12px; transition:transform .15s ease; }
  .rn-bn-cta:hover svg{ transform:translate(1.5px, -1.5px); }

  /* ---------- en vivo + totales + hora de actualización ---------- */
  .rn-bn-meta{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 15px; padding:7px 0; }
  .rn-bn-dot{ flex:none; width:8px; height:8px; border-radius:50%; background:#e30613; box-shadow:0 0 0 4px rgba(227,6,19,.18); animation:rn-bn-pulse 1.4s ease-in-out infinite; }
  .rn-bn-dot.is-final{ animation:none; }
  @keyframes rn-bn-pulse{ 0%, 100%{ opacity:1; } 50%{ opacity:.25; } }
  .rn-totals{ display:contents; margin:0; font-size:15px; }   /* sus datos se acomodan junto al punto, en la misma fila */
  .rn-totals > div{ font-size:15px; }
  .rn-totals > div{ display:flex; align-items:baseline; gap:6px; }
  .rn-totals dt{ font-weight:500; font-variant-caps:all-small-caps; letter-spacing:.03em; }
  .rn-totals dd{ margin:0; font-weight:800; font-variant-numeric:tabular-nums; }
  .rn-status{ margin:0; text-align:center; font-size:11.5px; color:var(--muted); }
  .rn-status.is-stale{ color:#9a5b00; }

  /* mobile: la foto tiene el alto del bloque de texto (18 + 2 + 22 + 2 + 14 = 58px) */
  @media (max-width:760px){
    .rn-bn-blank{ display:none; }   /* en celular no entra */
    .rn-bn-bar{ padding:6px 0; font-size:11.5px; }
    .rn-bn-bar .t{ gap:6px; }
    .rn-bn-flag{ width:17px; height:12px; }
    .rn-bn-main{ flex-direction:column; gap:8px; padding:10px 0 8px; }
    .rn-duel-wrap{ width:100%; }
    .rn-duel{ gap:14px; }
    .rn-rival{ gap:8px; }
    .rn-photo{ width:58px; height:58px; }
    .rn-rival-name{ font-size:14.5px; line-height:18px; }
    .rn-rival-pct{ margin-top:2px; font-size:22px; line-height:22px; }
    .rn-rival-votes{ margin-top:2px; font-size:11px; line-height:14px; }
    .rn-bn-meta{ gap:2px 14px; padding:7px 0; }
    .rn-totals > div{ font-size:14.5px; }
    .rn-status{ flex-basis:100%; font-size:10.5px; }
    .rn-bn-cta{ padding:5px 14px; font-size:12.5px; }
  }
  /* celulares angostos: 16 + 2 + 22 + 2 + 14 = 56px */
  @media (max-width:380px){
    .rn-duel{ gap:10px; }
    .rn-rival{ gap:7px; }
    .rn-photo{ width:56px; height:56px; }
    .rn-rival-name{ font-size:13.5px; line-height:16px; }
    .rn-rival-pct{ font-size:21px; }
    .rn-rival-votes{ font-size:10.5px; }
    .rn-bn-meta{ gap:2px 12px; }
    .rn-totals > div{ font-size:13.5px; }
  }
  /* muy angostos: 15 + 2 + 20 + 2 + 13 = 52px */
  @media (max-width:340px){
    .rn-duel{ gap:8px; }
    .rn-rival{ gap:6px; }
    .rn-photo{ width:52px; height:52px; }
    .rn-rival-name{ font-size:13px; line-height:15px; }
    .rn-rival-pct{ font-size:20px; line-height:20px; }
    .rn-rival-votes{ font-size:10px; line-height:13px; }
  }
  @media (prefers-reduced-motion:reduce){
    .rn-bn *{ transition:none !important; }
    .rn-bn-dot{ animation:none; }
  }
</style>
</head>
<body>
<div class="rn-bn" id="rnBn">
  <div class="rn-bn-bar">
    <span class="t">Elecciones <svg class="rn-bn-flag" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#009c3b"/><path d="M10 1.5L18.5 7 10 12.5 1.5 7z" fill="#ffdf00"/><circle cx="10" cy="7" r="3.5" fill="#002776"/><path d="M6.6 6.3c2.2-.5 4.6-.2 6.6.9" stroke="#fff" stroke-width=".8" fill="none"/></svg> <b>Brasil</b></span>
    <span id="rnRonda"></span>
  </div>
  <hr class="rn-rule">
  <div class="rn-bn-main">
    <div class="rn-duel-wrap" id="rnDuelWrap"><div class="rn-duel" id="rnDuel"></div></div>
    <div class="rn-bn-blank" id="rnBlank"></div>

  </div>
  <hr class="rn-rule">
  <div class="rn-bn-meta">
    <span class="rn-bn-dot" id="rnDot" aria-hidden="true"></span>
    <dl class="rn-totals">
      <div><dt>Escrutado:</dt><dd id="rnMesas">–</dd></div>

    </dl>
    <p class="rn-status" id="rnStatus" aria-live="polite">Cargando resultados del TSE…</p>
  </div>
  <hr class="rn-rule">
</div>

     DATOS DEL TSE (sólo el total nacional)
     ===================================================================== */
  var electionId = CONFIG.election, tpl = 0;
  function tseUrl(i){
    var c = CONFIG;
    return c.urlTemplates[i]
      .replace(/\{base\}/g, (c.proxyUrl || c.baseUrl).replace(/\/$/, ""))
      .replace(/\{env\}/g, c.environment).replace(/\{year\}/g, c.year)
      .replace(/\{election6\}/g, ("000000" + electionId).slice(-6))
      .replace(/\{election\}/g, electionId).replace(/\{office\}/g, c.office)
      .replace(/\{abr\}/g, "br");
  }
  function getJSON(url){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, CONFIG.timeout);
    return fetch(url, { cache: "no-cache", signal: ctrl.signal }).then(function(res){
      clearTimeout(t);
      if (!res.ok) { var e = new Error("HTTP " + res.status); e.httpStatus = res.status; throw e; }
      return res.json();
    }, function(err){ clearTimeout(t); throw err; });
  }
  function fetchNational(){
    var n = CONFIG.urlTemplates.length;
    function attempt(k, lastErr){
      if (k >= n) return Promise.reject(lastErr);
      var i = (tpl + k) % n;
      return getJSON(tseUrl(i)).then(function(raw){ tpl = i; return parseTSE(raw); },
        function(e){ if (e.httpStatus === 404) return attempt(k + 1, e); throw e; });
    }
    return attempt(0, null);
  }

  function num(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    var s = String(v).trim();
    if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function pct(o, k){ if (!o) return null; var p = num(o[k + "n"]); return p !== null ? p : num(o[k]); }

  function parseTSE(raw){
    if (!raw || typeof raw !== "object") throw new Error("respuesta vacía");
    var legacy = !Array.isArray(raw.carg) && Array.isArray(raw.cand);
    if (!legacy && !Array.isArray(raw.carg)) throw new Error("formato desconocido");
    var cands = [];
    function push(c, partido){
      if (String(c.dvt || "Válido").toLowerCase().indexOf("anulado") === 0) return;
      cands.push({ numero: num(c.n), partido: partido, votos: num(c.vap), porcentagem: pct(c, "pvap") });
    }
    if (legacy) {
      raw.cand.forEach(function(c){ push(c, String(c.cc || "").split(" - ")[0].trim() || null); });
    } else {
      var cargo = raw.carg.filter(function(c){ return num(c.cd) === Number(CONFIG.office); })[0] || raw.carg[0];
      (cargo && cargo.agr || []).forEach(function(a){ (a.par || []).forEach(function(p){ (p.cand || []).forEach(function(c){ push(c, p.sg || null); }); }); });
    }
    var s = legacy ? { pst: raw.pst, pstn: raw.pstn } : (raw.s || {});
    var v = legacy ? raw : (raw.v || {});
    var tv = num(v.tv);
    function share(votos, p){ return { votos: votos, pct: p !== null ? p : (votos !== null && tv ? votos / tv * 100 : null) }; }
    var vNulos = num(v.tvn); if (vNulos === null) vNulos = num(v.vn);
    var pNulos = pct(v, "ptvn"); if (pNulos === null) pNulos = pct(v, "pvn");
    return {
      apurado: pct(s, "pst"), publicados: raw.dv !== "n", final: raw.tf === "s",
      total: tv, validos: num(v.vv), hora: raw.ht || null, fecha: fechaLarga(raw.dt),
      blancos: share(num(v.vb), pct(v, "pvb")), nulos: share(vNulos, pNulos),
      candidatos: cands
    };
  }

  /* =====================================================================
     RENDER
     ===================================================================== */
  var $ = function(id){ return document.getElementById(id); };
  function setText(el, t){ if (el && el.textContent !== t) el.textContent = t; }
  function matches(d, c){ return c.numero === d.numero || (d.partido && c.partido === d.partido); }
  var destacados = DESTACADOS;

  // Ordena los hijos de un contenedor de mayor a menor porcentaje (empates: el orden original).
  // Mueve los nodos sólo si el orden cambia.
  function ordenar(box, items){
    items.sort(function(a, b){ return (b.p - a.p) || (a.i - b.i); });
    var actual = Array.prototype.slice.call(box.children);
    if (items.every(function(it, k){ return actual[k] === it.el; })) return;
    items.forEach(function(it){ box.appendChild(it.el); });
  }

  function initStatic(){
    $("rnBlank").innerHTML = BLANCOS.map(function(b){
      return '<div data-b="' + b.k + '"><img src="' + b.icon + '" alt="" width="52" height="34"><div><p class="n">' + esc(b.nombre) + '</p><p class="v">–</p></div></div>';
    }).join("");
    setText($("rnRonda"), CONFIG.ronda);
    if (CONFIG.link) { $("rnCta").href = CONFIG.link; setText($("rnCtaText"), CONFIG.boton); $("rnCta").hidden = false; }
    $("rnDuel").innerHTML = destacados.map(function(d, i){
      return '<div class="rn-rival" data-i="' + i + '">' +
        '<div class="rn-photo" style="background:' + d.fondo + '"><img src="' + d.foto + '" alt="" width="225" height="225"></div>' +
        '<div><p class="rn-rival-name">' + esc(d.nombre) + '</p>' +
        '<p class="rn-rival-pct" style="color:' + d.color + '">–</p><p class="rn-rival-votes"></p></div></div>';
    }).join("");
  }

  var data = null, lastOk = null;
  function render(){
    var r = data, st = $("rnStatus");
    st.className = "rn-status";
    if (!r) { st.hidden = false; setText(st, lastOk === false ? "No se pudieron leer los datos del TSE. Se reintenta cada 20 segundos." : "Cargando resultados del TSE…"); return; }
    setText($("rnMesas"), fmtPct(r.apurado));
    setText($("rnTotal"), fmtNum(r.total || 0));          // 0 mientras el TSE no informa votos
    $("rnDot").classList.toggle("is-final", r.final);    // deja de titilar con el escrutinio terminado
    // Candidatos: el que va ganando a la izquierda
    ordenar($("rnDuel"), destacados.map(function(d, i){
      var el = document.querySelector('.rn-rival[data-i="' + i + '"]');
      var c = r.candidatos.filter(function(x){ return matches(d, x); })[0];
      setText(el.querySelector(".rn-rival-pct"), r.publicados && c ? fmtPct(c.porcentagem) : "–");
      setText(el.querySelector(".rn-rival-votes"), r.publicados && c ? fmtNum(c.votos) + " votos" : "");
      return { el: el, p: r.publicados && c ? c.porcentagem || 0 : 0, i: i };
    }));
    // Blancos y nulos: el mayor arriba
    ordenar($("rnBlank"), BLANCOS.map(function(b, i){
      var el = document.querySelector('[data-b="' + b.k + '"]'), v = r[b.k], ok = r.publicados && v && v.pct !== null;
      setText(el.querySelector(".v"), ok ? fmtPct(v.pct) : "–");
      return { el: el, p: ok ? v.pct : 0, i: i };
    }));
    // Mismo formato que el mapa, pero sólo con la hora (sin el día)
    var hora = r.hora || "";
    var txt = lastOk === false ? "Últimos datos disponibles" + (hora ? ": " + hora.slice(0, 5) : "")
      : hora ? (r.final ? "Resultado final · " : "Actualizado: ") + hora : "";
    if (lastOk === false) st.classList.add("is-stale");
    setText(st, txt);
    st.hidden = !txt;
    updateDuelFades();
  }

  /* ---------- tira deslizable: degradés, rueda del mouse suave ---------- */
  function updateDuelFades(){
    var duel = $("rnDuel"), max = duel.scrollWidth - duel.clientWidth;
    $("rnDuelWrap").classList.toggle("can-left", duel.scrollLeft > 2);
    $("rnDuelWrap").classList.toggle("can-right", duel.scrollLeft < max - 2);
  }
  var wheelTarget = null, wheelRaf = 0;
  function wheelStep(){
    var d = $("rnDuel"), diff = wheelTarget - d.scrollLeft;
    if (Math.abs(diff) < 1) { d.scrollLeft = wheelTarget; wheelTarget = null; wheelRaf = 0; return; }
    var step = diff * 0.2;
    if (Math.abs(step) < 1) step = diff > 0 ? 1 : -1;
    d.scrollLeft += step;
    wheelRaf = requestAnimationFrame(wheelStep);
  }
  function stopWheel(){ if (wheelRaf) cancelAnimationFrame(wheelRaf); wheelRaf = 0; wheelTarget = null; }
  function bindStrip(){
    var d = $("rnDuel");
    d.addEventListener("scroll", updateDuelFades, { passive: true });
    window.addEventListener("resize", updateDuelFades);
    d.addEventListener("wheel", function(ev){
      if (ev.ctrlKey || Math.abs(ev.deltaX) >= Math.abs(ev.deltaY)) { stopWheel(); return; }
      var max = d.scrollWidth - d.clientWidth;
      var delta = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? d.clientWidth : 1);
      var from = wheelTarget === null ? d.scrollLeft : wheelTarget;
      if ((delta > 0 && from >= max - 1) || (delta < 0 && from <= 0)) return;
      ev.preventDefault();
      wheelTarget = Math.max(0, Math.min(max, from + delta));
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { d.scrollLeft = wheelTarget; wheelTarget = null; return; }
      if (!wheelRaf) wheelRaf = requestAnimationFrame(wheelStep);
    }, { passive: false });
    d.addEventListener("touchstart", stopWheel, { passive: true });
  }

  /* =====================================================================
     ACTUALIZACIÓN AUTOMÁTICA
     ===================================================================== */
  var timer = null, running = false, lastRun = 0;
  function tick(){
    if (running) return;
    running = true; lastRun = Date.now();
    fetchNational().then(function(d){ data = d; lastOk = true; }, function(e){ lastOk = false; console.warn("[TSE]", e && e.message); })
      .then(function(){
        running = false; render(); postHeight();
        clearTimeout(timer);
        if (!(data && data.final)) timer = setTimeout(function loop(){
          if (document.hidden) { timer = setTimeout(loop, CONFIG.updateInterval); return; }
          tick();
        }, CONFIG.updateInterval);
      });
  }
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && !(data && data.final) && Date.now() - lastRun > CONFIG.updateInterval) tick();
  });

  /* ---------- altura para el iframe (la del contenido: el alto del documento nunca baja del alto del iframe) ---------- */
  function postHeight(){
    if (window.parent === window) return;
    window.parent.postMessage({ type: "rn-iframe-height", id: "balotaje-brasil-2026-banner", height: Math.ceil($("rnBn").getBoundingClientRect().height) }, "*");
  }
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);

  window.__rnBrasilBanner = { get data(){ return data; }, refresh: tick };
  initStatic();
  bindStrip();
  updateDuelFades();
  tick();
})();
</script>
</body>
